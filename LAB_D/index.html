<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="aplikacja">
    <section class="panel">
      <div class="wiersz-szukania">
        <input id="cityInput" type="text" placeholder="Wpisz miasto . . ." />
        <button id="checkBtn" aria-label="Sprawdź pogodę">Pogoda</button>
      </div>
    </section>

    <section class="wyniki">
      <div id="currentBox" class="blok-wyniku"></div>
      <div id="forecastBox" class="blok-wyniku"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
